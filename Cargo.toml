[package]
name = "seance"
version = "0.4.2"
edition = "2021"
description = "The Seance engine — what powers the Necrometer card. Measures how dead your GitHub repos are and renders an embeddable necrosis gauge."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]
name = "seance"

[package.metadata.wasm-pack.profile.release]
# wasm-pack's bundled wasm-opt predates bulk-memory ops rustc emits — skip it.
wasm-opt = false

[[bin]]
name = "seance"
path = "src/main.rs"
required-features = []

# -- Features --
# `serve` enables the web server subcommand. The default release tarball
# builds without `serve` (card + hall only); the container image builds
# with `--features serve`.
[features]
default = []
serve = []

# -- Dependencies: zero in the common section. --
# Every crate that used to live here is now hand-rolled under std.
# See src/{error,time,json,http,http_server,escape}.rs.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# TLS for the native HTTPS client. rustls (no OpenSSL) keeps the musl
# binary statically linked; webpki-roots bundles CA certs so we don't
# depend on the system trust store.
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12", "ring"] }
webpki-roots = "0.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"