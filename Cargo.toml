[package]
name = "necrometer"
version = "0.3.0"
edition = "2021"
description = "The Necrometer — measures how dead your GitHub repos are. Embeddable necrosis gauges for READMEs."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "necrometer"
path = "src/main.rs"
required-features = []

# -- Features --
# `serve` enables the web server subcommand. The default release tarball
# builds without `serve` (card + hall only); the container image builds
# with `--features serve`.
[features]
default = []
serve = []

# -- Dependencies: zero in the common section. --
# Every crate that used to live here is now hand-rolled under std.
# See src/{error,time,json,http,http_server,escape}.rs.

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
# TLS for the native HTTPS client. rustls (no OpenSSL) keeps the musl
# binary statically linked; webpki-roots bundles CA certs so we don't
# depend on the system trust store.
rustls = { version = "0.23", default-features = false, features = ["std", "logging", "tls12"] }
webpki-roots = "0.26"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"