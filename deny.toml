# cargo-deny configuration. We have a deliberately tiny dep graph:
# native = rustls + webpki-roots (+ their transitive)
# wasm   = wasm-bindgen
# Anything else in the dep graph is a transitive dep of those crates.

[graph]
all-features = true

[advisories]
# Treat any advisory as a build failure. Adjust if a fix is pending.
version = 2
yanked = "warn"

[licenses]
# Allow-list matches the licenses actually present in the rustls +
# wasm-bindgen closure. CI runs `cargo deny check --deny warnings`, so
# unused allowances would fail the build — don't list licenses we don't
# currently depend on.
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "CDLA-Permissive-2.0",  # webpki-roots (Mozilla CA bundle)
    "ISC",
    "MIT",
    "Unicode-3.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
