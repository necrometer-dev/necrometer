# cargo-deny configuration. We have a deliberately tiny dep graph:
# native = rustls + webpki-roots (+ their transitive)
# wasm   = wasm-bindgen
# Anything else in the dep graph is a transitive dep of those crates.

[graph]
all-features = true

[advisories]
# Treat any advisory as a build failure. Adjust if a fix is pending.
version = 2
yanked = "warn"

[licenses]
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "ISC",
    "MIT",
    "MPL-2.0",
    "Unicode-DFS-2016",
    "Unicode-3.0",
    "Zlib",
    "OpenSSL",         # ring2 ships this for its bundled BoringSSL
    "0BSD",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
highlight = "all"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
