name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

permissions: { contents: read }

jobs:
  fmt-clippy-test:
    name: fmt + clippy + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --all-features -- -D warnings
      - run: cargo test --lib
      # Rebuild the wasm once and smoke-test that analyze_repos returns a
      # non-empty reading + render_card returns a valid SVG. If the JS clock
      # import breaks again this will catch it.
      #
      # The smoke lives in ci/wasm-smoke.mjs (ESM — pkg/seance.js is
      # "type": "module"). Do not inline it here: a plain `run:` scalar
      # containing `: ` is invalid YAML and GitHub will fail the workflow
      # at parse time with zero jobs.
      - run: bash ci/install-wasm-pack.sh
      - run: wasm-pack build --release --target web --out-dir pkg
      - run: node ci/wasm-smoke.mjs

  musl:
    name: musl static build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --target x86_64-unknown-linux-musl --bin seance
      - run: ls -la target/x86_64-unknown-linux-musl/release/seance
