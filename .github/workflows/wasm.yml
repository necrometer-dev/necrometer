name: wasm

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm.yml'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    name: Build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install wasm-pack
        run: bash ci/install-wasm-pack.sh

      - name: Build wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
      - run: wasm-pack build --release --target web --out-dir pkg

      - uses: actions/upload-artifact@v4
        with:
          name: seance-wasm
          path: pkg

      - name: commit pkg for the site sync
        run: |
          set -euo pipefail
          git config user.name "necrometer[bot]"
          git config user.email "bot@necrometer.dev"
          git add -f pkg/seance.js pkg/seance.d.ts pkg/seance_bg.wasm \
            pkg/seance_bg.wasm.d.ts pkg/snippets
          if git diff --cached --quiet; then
            echo "pkg unchanged"
            exit 0
          fi
          git commit -m "wasm: refresh pkg"
          git pull --rebase --autostash
          git push
