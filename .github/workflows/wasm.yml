name: wasm

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/wasm.yml'
      - 'ci/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build wasm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm-pack
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --location \
            https://rustwasm.github.io/wasm-pack/installer/init.sh -o /tmp/wi
          bash /tmp/wi

      - name: Build wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
      - run: wasm-pack build --release --target web --out-dir pkg

      - uses: actions/upload-artifact@v4
        with:
          name: seance-wasm
          path: pkg
          # The github.io pkg/ is updated in necrometer-dev.github.io
          # (GITHUB_TOKEN cannot open a PR in another repo).
