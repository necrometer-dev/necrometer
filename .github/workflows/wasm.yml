name: wasm

on:
  push:
    branches: [ master ]
    paths:
      - 'src/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-publish:
    name: Build wasm + refresh site/pkg
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install wasm-pack
        run: |
          curl --proto '=https' --tlsv1.2 --silent --show-error --location \
            https://rustwasm.github.io/wasm-pack/installer/init.sh -o /tmp/wi
          bash /tmp/wi

      - name: Build wasm
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
      - run: wasm-pack build --release --target web --out-dir pkg

      - name: Open PR into necrometer-dev.github.io
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.NECRO_TOKEN }}
          push-to-fork: necrometer-dev/necrometer-dev.github.io
          branch: bot/wasm-${{ github.sha }}
          title: "wasm: refresh pkg from seance @ ${{ github.sha }}"
          body: |
            Auto-generated by `seance/.github/workflows/wasm.yml`.

            Rebuilds the wasm bundle and refreshes:
            - `pkg/seance_bg.wasm`
            - `pkg/seance.js`
            - `pkg/seance.d.ts`
            - `pkg/seance_bg.wasm.d.ts`

            Review the diff, then merge.
          add-paths: |
            pkg/seance_bg.wasm
            pkg/seance.js
            pkg/seance.d.ts
            pkg/seance_bg.wasm.d.ts
          commit-message: "wasm: rebuild from seance @ ${{ github.sha }}"
