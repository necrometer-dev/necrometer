name: audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "17 7 * * 1"   # weekly Monday

permissions: { contents: read }

jobs:
  audit:
    name: cargo audit + cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-audit: known CVEs in the dep graph (only rustls + webpki-roots
      # in the native build, plus their transitive crates).
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --deny warnings
      # cargo-deny: license, ban-list, source restrictions, duplicate
      # versions. Catches a typo'd registry or a yanked transitive.
      # Installed the same way as cargo-audit — cargo-deny-action v1
      # prepends `arguments` before `check`, and current cargo-deny
      # rejects `--deny` as a global flag (`check --deny` is the form).
      - uses: taiki-e/install-action@cargo-deny
      - run: cargo deny check --deny warnings
