name: audit

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]
  schedule:
    - cron: "17 7 * * 1"   # weekly Monday

permissions: { contents: read }

jobs:
  audit:
    name: cargo audit + cargo deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # cargo-audit: known CVEs in the dep graph (only rustls + webpki-roots
      # in the native build, plus their transitive crates).
      - uses: taiki-e/install-action@cargo-audit
      - run: cargo audit --deny warnings
      # cargo-deny: license, ban-list, source restrictions, duplicate
      # versions. Catches a typo'd registry or a yanked transitive.
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          arguments: --deny warnings
